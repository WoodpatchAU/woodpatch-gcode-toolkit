#
# An alarm on main: squash-merge messages are written at merge time, after the PR's
# checks ran, so every push to main is scanned for references to private work (the
# same check as the PR step in ci.yml). Its own workflow with NO concurrency group:
# GitHub keeps only one pending run per group, so a burst of merges (a stacked series)
# could otherwise drop one and never scan its message. It gates nothing.
name: private-refs-on-main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - name: Checkout (full history, blobless)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --filter=blob:none origin "${GITHUB_SHA}"
          git checkout -q --detach "${GITHUB_SHA}"
      - name: No references to private work in what was pushed
        run: |
          case "$BEFORE_SHA" in '' | 0000000000000000000000000000000000000000)
            echo "::warning::no previous commit for this push, so nothing was scanned"
            exit 0
            ;;
          esac
          .github/ci/check-private-refs.sh "$BEFORE_SHA" "$GITHUB_SHA"
