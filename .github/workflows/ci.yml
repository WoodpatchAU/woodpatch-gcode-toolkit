#
# CI for the toolkit. Deliberately uses NO `uses:` steps (ADR-0006), not even
# GitHub's own actions: the repo's Actions policy blocks third-party actions, and
# plain shell with pinned hashes is a smaller trust surface than any action.
#
# GitHub-hosted runners only. This repository is public, so a self-hosted runner
# would execute strangers' fork-PR code on Woodpatch infrastructure.
#
# Job names are the required-check names on `main`; renaming one means updating
# branch protection too.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR supersedes the older run. Not on main: two merges in a row
  # would cancel the first one's checks, the private-refs alarm among them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Values from the event, passed through env rather than interpolated into
  # shell text, so they can never be parsed as script.
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  # ── Lint, typecheck, test, build, and the built-artefact licence checks ──
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach "${GITHUB_SHA}"
      - name: Toolchain (Node + pnpm, hash-pinned)
        run: .github/ci/setup-toolchain.sh
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        # Before typecheck and test: packages import each other through their built
        # dist/ (package exports), so the core must be built before the viewer and
        # editor can be checked. pnpm -r builds in dependency order.
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Vendored-library licence records match the audit table
        run: node tools/gen-legacy-licences.mjs --check
      - name: Legacy goldens are current (upstream's recorded behaviour)
        # Regenerates every golden from the fixtures and fails on any difference, so
        # goldens only change through the reviewed generator (ADR-0012).
        run: node tools/golden-legacy.cjs --check
      - name: Legacy harness tests (smoke + plan §2.4 reference values)
        run: node --test 'tools/**/*.test.cjs'
      - name: Playground smoke tests (real browser, the runner's preinstalled Chrome)
        # The playground was built (and its MIT notice checked) by the Build step.
        run: pnpm --filter @woodpatch/gcode-playground e2e
      - name: Lighthouse performance >= 90, median of 3 (ADR-0031)
        # The runner's preinstalled Chrome, as for the smoke tests: no browser download.
        run: |
          CHROME_PATH="$(command -v google-chrome)"
          export CHROME_PATH
          pnpm --filter @woodpatch/gcode-playground lighthouse
      - name: Licence notice survives into packages and minified bundles
        run: pnpm licence:packages
      - name: Parity ledger (every difference from upstream explained, ADR-0025)
        run: node tools/parity.mjs --check
      - name: Performance budget (ADR-0014)
        # A ratio against upstream's parser, measured on this runner: machine-independent.
        run: node --expose-gc tools/bench-core.mjs --ci

  # ── Every file carries copyright + licence information ──
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach "${GITHUB_SHA}"
      - name: reuse lint
        # Pinned version; pipx runs it in a throwaway venv.
        run: pipx run 'reuse==6.2.0' lint

  # ── The fork's inheritance is intact, and PR commits carry a DCO sign-off ──
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history, blobless)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --filter=blob:none origin "${GITHUB_SHA}" ${BASE_SHA:+"$BASE_SHA"} ${HEAD_SHA:+"$HEAD_SHA"}
          git checkout -q --detach "${GITHUB_SHA}"
      - name: Upstream history preserved
        # 954 = upstream's commit count at the fork point (plan §5 Phase 0).
        # A shallow rewrite or a history-flattening re-import would fail this.
        run: |
          count=$(git rev-list --count HEAD)
          echo "commits reachable from HEAD: $count"
          test "$count" -ge 954
          # The fork point (upstream gh-pages, tag upstream-2025-09-18) is an ancestor.
          git merge-base --is-ancestor d315a359123b1a2ac49e0ef0b4510e70915c5b2b HEAD
      - name: Upstream licence file unmodified, at its original path
        # LICENSE.txt is Nicolas Raynaud's own dual-licence file. It must never be
        # edited, moved or deleted (NOTICE, ADR-0001).
        run: echo "d7fd338e223d0d59f2656c5009c7a1a006d8269ab61da6c29258e28cff940645  LICENSE.txt" | sha256sum -c -
      - name: DCO sign-off on every PR commit
        if: github.event_name == 'pull_request'
        run: .github/ci/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
      - name: No references to private work in the PR
        # Added lines, commit messages (merges too), and the PR's title and body (from
        # the event payload, read as data by the script, never interpolated here). Not
        # re-run when only the title or body is edited (operator decision, 2026-09-28):
        # review covers those edits. Runs even if the DCO step failed.
        if: always() && github.event_name == 'pull_request'
        run: |
          node --test .github/ci/private-refs.test.mjs
          # The checker from the BASE branch, so a PR can't loosen what judges it. The PR
          # that adds the check has no base copy yet, and bootstraps with its own.
          refs="$RUNNER_TEMP/private-refs"
          mkdir -p "$refs"
          for f in check-private-refs.sh private-refs.mjs; do
            # Decided on the base TREE, which is always local (this clone is blobless):
            # a blob that fails to fetch must fail the step, not fall back to the PR's copy.
            if [ -n "$(git ls-tree --name-only "$BASE_SHA" -- ".github/ci/$f")" ]; then
              git show "$BASE_SHA:.github/ci/$f" >"$refs/$f"
            else
              cp ".github/ci/$f" "$refs/$f"
            fi
          done
          # Canaries: the checker must catch a leak it's handed, on both paths, or it is
          # failing open. The commit one is an added line starting "++ ", which a diff
          # parser can mistake for a header.
          printf '{"pull_request":{"title":"canary","body":"see %s1999"}}' '#' >"$refs/canary.json"
          if GITHUB_EVENT_PATH="$refs/canary.json" bash "$refs/check-private-refs.sh" >/dev/null; then
            echo "::error::the private-refs check missed its title/body canary: it is failing open"
            exit 1
          fi
          c="$refs/canary-repo"
          git init -q "$c"
          git -C "$c" -c user.name=canary -c user.email=canary@invalid commit -q --allow-empty -m base
          printf '++ see %s1999\n' '#' >"$c/canary.txt"
          git -C "$c" add canary.txt
          git -C "$c" -c user.name=canary -c user.email=canary@invalid commit -q -m canary
          if (cd "$c" && env -u GITHUB_EVENT_PATH bash "$refs/check-private-refs.sh" HEAD~1 HEAD >/dev/null); then
            echo "::error::the private-refs check missed its commit canary: it is failing open"
            exit 1
          fi
          bash "$refs/check-private-refs.sh" "$BASE_SHA" "$HEAD_SHA"

  # ── An alarm on main: squash-merge messages are written at merge time, after the PR
  # checks ran. Its own job, so an alarm never holds up the playground deploy. ──
  private-refs-on-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - name: Checkout (full history, blobless)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --filter=blob:none origin "${GITHUB_SHA}"
          git checkout -q --detach "${GITHUB_SHA}"
      - name: No references to private work in what was pushed
        run: |
          case "$BEFORE_SHA" in '' | 0000000000000000000000000000000000000000)
            echo "::warning::no previous commit for this push, so nothing was scanned"
            exit 0
            ;;
          esac
          .github/ci/check-private-refs.sh "$BEFORE_SHA" "$GITHUB_SHA"

  # ── Publish the playground (pushes to main only, after every check passes) ──
  deploy-playground:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, reuse, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that can write, and only to push the built site (ADR-0028).
    permissions:
      contents: write
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach "${GITHUB_SHA}"
      - name: Toolchain (Node + pnpm, hash-pinned)
        run: .github/ci/setup-toolchain.sh
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy the playground to the 'site' branch (GitHub Pages)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/ci/deploy-site.sh apps/playground/dist
