#
# Dependency updates for the pnpm workspace only (ADR-0039). CI uses no GitHub Actions,
# so there is no "github-actions" ecosystem to watch; Node, pnpm and reuse are pinned by
# hash in .github/ci and bumped by hand.
version: 2
updates:
  - package-ecosystem: npm # covers pnpm workspaces and pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml: no release younger than 7 days
    # (a compromised publish is usually caught and pulled within days). Security
    # updates are not delayed by this.
    cooldown:
      default-days: 7
    # One PR for the routine minor and patch bumps; a major gets a PR of its own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
