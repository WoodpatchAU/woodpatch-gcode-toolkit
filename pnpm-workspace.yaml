packages:
  - packages/*
  - apps/*

# Supply-chain cooldown: never resolve a version published less than 7 days ago.
# Most malicious npm releases are caught and unpublished within that window.
minimumReleaseAge: 10080

# Dependency lifecycle scripts are blocked unless listed here as true, which
# should happen only after reading what the script does.
allowBuilds:
  # Reviewed, left blocked. esbuild's script only swaps its JS shim for the native
  # binary to save startup time. The binary arrives anyway via the optional
  # @esbuild/<platform> package, and esbuild works without the script.
  esbuild: false

# Security floors for transitive dependencies the direct ones haven't caught up with.
# Each names the advisory it answers; drop it once nothing resolves below it.
overrides:
  # GHSA-r825, GHSA-587h, GHSA-698v (fixed in 2.14.2): reached through @changesets/cli.
  launch-editor: ^2.14.2
