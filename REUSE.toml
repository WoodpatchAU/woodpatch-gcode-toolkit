# SPDX-License-Identifier: MIT
#
# Licensing for files that cannot carry an inline SPDX header. Kept deliberately
# NARROW: code, docs and scripts carry their own header, and `reuse lint` in CI
# fails any file that has neither. Do not add a catch-all glob here, because that
# would silently license every future file and defeat the check.
version = 1

# Machine-written or comment-less config files (JSON has no comment syntax).
[[annotations]]
path = [
  "package.json",
  "packages/*/package.json",
  "apps/*/package.json",
  "apps/*/tsconfig*.json",
  "pnpm-lock.yaml",
  "tsconfig*.json",
  "packages/*/tsconfig*.json",
  ".changeset/config.json",
  ".changeset/*.md",
  ".gitignore",
  ".prettierignore",
  ".editorconfig",
  ".nvmrc",
  "tools/data/*.json",
  "NOTICE",
  "packages/*/NOTICE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Promotional Notions Pty Ltd trading as Woodpatch House & Garden"
SPDX-License-Identifier = "MIT"

# Upstream's own work, parked under legacy/ (ADR-0005). Offered by its author
# under MIT OR AGPL-3.0 (see LICENSE.txt, upstream's file, unmodified).
[[annotations]]
path = "legacy/**"
precedence = "override"
SPDX-FileCopyrightText = "2016 Nicolas Raynaud"
SPDX-License-Identifier = "MIT OR AGPL-3.0-only"

# Test fixtures that cannot carry a header without changing the input under
# test. A comment line would alter what the parser sees, and some cases test
# the first bytes, line endings or byte-order marks.
[[annotations]]
path = ["fixtures/synthetic/**", "fixtures/golden/legacy/synthetic/**", "fixtures/machine/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Promotional Notions Pty Ltd trading as Woodpatch House & Garden"
SPDX-License-Identifier = "MIT"

# Upstream's sample programs, copied from legacy/webapp/samples/ so the corpus
# outlives legacy/ (ADR-0005).
[[annotations]]
path = ["fixtures/upstream/**"]
precedence = "override"
SPDX-FileCopyrightText = "2016 Nicolas Raynaud"
SPDX-License-Identifier = "MIT OR AGPL-3.0-only"

# Goldens recorded from upstream's own sample programs are derived from those
# files, so both copyright holders appear. MIT is the arm elected in ADR-0001.
[[annotations]]
path = ["fixtures/golden/legacy/upstream/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2016 Nicolas Raynaud", "2026 Promotional Notions Pty Ltd trading as Woodpatch House & Garden"]
SPDX-License-Identifier = "MIT"

